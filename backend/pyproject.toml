[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qap"
version = "0.1.0"
description = "QuantumAgentApp backend: multi-tenant quantum-agent platform (FastAPI prototype)"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "QuantumAgentApp backend team" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    # v1.3 附件上传（multipart/form-data）所需；FastAPI 表单解析的事实依赖
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
# v1.4 §9：logicalcloud 真机接入（hardware provider 模式）的可选依赖；
# simulated 模式无需安装（适配层惰性导入，见 hardware/lqcloud_adapter.py）。
hardware = [
    "lqcloud==0.5.1",
]

# 原型刻意保持最小依赖面：不引入 ORM/agent 框架（见 docs/ARCHITECTURE.md §2 工程选择）。
[tool.hatch.build.targets.wheel]
packages = ["src/qap"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
testpaths = ["tests"]
