# =============================================================================
# QuantumAgentApp 全局配置（唯一配置入口）
# -----------------------------------------------------------------------------
# 规则：
#   1. 平台一切配置集中于本文件；后端启动时读取（环境变量 QAP_CONFIG 可覆盖路径，
#      默认为仓库根目录 ./config.toml）。
#   2. 密钥绝不写入本文件：每个模型通过 `api_key_env` 指向环境变量名，
#      运行时从环境读取。
#   3. 原型默认 `provider = "mock"`（零算力消耗、可离线演示）；
#      接真实模型时改 `models.default` 的 provider/base_url/model 即可。
# =============================================================================

[server]
host = "127.0.0.1"
port = 8000
# 前端 Vite 开发服务器来源（CORS 白名单）
cors_origins = ["http://localhost:5173", "http://127.0.0.1:5173"]

# -----------------------------------------------------------------------------
# 模型提供方：支持三种 provider wire format
#   provider = "openai"     → OpenAI Chat Completions 兼容格式（含各类中转/本地 vLLM）
#   provider = "anthropic"  → Anthropic Messages API 格式
#   provider = "mock"       → 内置脚本化 Mock（测试与演示用，不访问网络）
# -----------------------------------------------------------------------------

[models.default]
provider = "mock"                       # 原型默认：不消耗算力
model = "scripted-demo"
# 接真实 OpenAI 格式时的示例（取消注释并调整）：
# provider = "openai"
# model = "gpt-4o-mini"
# base_url = "https://api.openai.com/v1"
# api_key_env = "OPENAI_API_KEY"
# timeout_seconds = 120

[models.claude]
provider = "anthropic"
model = "claude-sonnet-4-5"
base_url = "https://api.anthropic.com"
api_key_env = "ANTHROPIC_API_KEY"
timeout_seconds = 120
default_thinking = "off"

# ----- GLM 渠道池（OpenAI 兼容；**Coding Plan 订阅端点** /api/coding/paas/v4
# ——订阅 Key 在普通按量端点 /api/paas/v4 会报 1113 余额不足，2026-10-14 实测；
# thinking.type 支持
# enabled/disabled/low/high/max；glm-5.3 系不接受 disabled，思考增量走
# delta.reasoning_content）。密钥从环境变量 GLM_API_KEY 读取。 -----

# TOML 语法注意：ref 含点号（如 glm-5.3-flash）必须给键加引号，
# 否则 [models.glm-5.3-flash] 会被解析为 models.glm-5 → 3-flash 嵌套表。

[models."glm-5.3-flash"]
provider = "openai"
model = "glm-5.3-flash"
base_url = "https://open.bigmodel.cn/api/coding/paas/v4"
api_key_env = "GLM_API_KEY"
timeout_seconds = 180
default_thinking = "low"

[models."glm-5.3"]
provider = "openai"
model = "glm-5.3"
base_url = "https://open.bigmodel.cn/api/coding/paas/v4"
api_key_env = "GLM_API_KEY"
timeout_seconds = 300
default_thinking = "high"

[models.openai-compatible]
provider = "openai"
model = "gpt-4o-mini"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
timeout_seconds = 120
default_thinking = "off"

[models.mock]
provider = "mock"
model = "scripted-demo"
default_thinking = "off"

# -----------------------------------------------------------------------------
# Agent 运行时与内置演示插件
# -----------------------------------------------------------------------------

[agents]
# 未显式绑定模型时使用的模型引用（指向 [models.<key>]）。
# 本机真实运行 GLM：在 config.local.toml（gitignored）覆盖为 "glm-5.3-flash"。
default_model_ref = "default"
# 插件安装目标目录（运行时安装内容，gitignored；管理平台"插件管理"写入此处）
plugins_dir = "plugins"

[agents.builtin.orchestrator]
enabled = true
model_ref = "default"

[agents.builtin.algorithm-designer]
enabled = true
model_ref = "default"

[agents.builtin.calibration]
enabled = true
model_ref = "default"

[agents.builtin.echo]
enabled = true
model_ref = "default"

# -----------------------------------------------------------------------------
# 异构硬件注册表（原型：模拟节点；simulated = true 时由内置模拟器驱动利用率）
# kind: "qpu" | "gpu" | "cpu"；capacity = 同时可承载的步数（租约数）
# -----------------------------------------------------------------------------

[hardware]
simulated = true
tick_seconds = 2.0    # 模拟器利用率刷新周期（秒）

# QPU 机群（对齐 logicalcloud 现网 10 台可用；v1.2 每台含网格拓扑，
# 保真度由模拟器在文献合理区间生成并漂移——simulated，非硬件观测）
[[hardware.nodes]]
id = "qpu-quanta-20q"
kind = "qpu"
name = "QuANTA 20Q"
model = "superconducting-transmon"
capacity = 1
# v1.2 拓扑定义（rows×cols 网格；保真度初值由模拟器在文献合理区间生成并漂移）
topology = { rows = 4, cols = 5 }

[[hardware.nodes]]
id = "qpu-quanta-16q-a"
kind = "qpu"
name = "QuANTA 16Q · A"
model = "superconducting-transmon"
capacity = 1
topology = { rows = 4, cols = 4 }

[[hardware.nodes]]
id = "qpu-quanta-16q-b"
kind = "qpu"
name = "QuANTA 16Q · B"
model = "superconducting-transmon"
capacity = 1
status = "offline"      # v1.3：离线（不可调度，前端降饱和标注）
topology = { rows = 4, cols = 4 }

[[hardware.nodes]]
id = "qpu-quanta-24q-a"
kind = "qpu"
name = "QuANTA 24Q"
model = "superconducting-transmon"
capacity = 1
topology = { rows = 4, cols = 6 }

[[hardware.nodes]]
id = "qpu-quanta-20q-b"
kind = "qpu"
name = "QuANTA 20Q · B"
model = "superconducting-transmon"
capacity = 1
topology = { rows = 5, cols = 4 }

[[hardware.nodes]]
id = "qpu-quanta-12q-a"
kind = "qpu"
name = "QuANTA 12Q"
model = "superconducting-transmon"
capacity = 1
status = "offline"      # v1.3：离线（不可调度，前端降饱和标注）
topology = { rows = 3, cols = 4 }

[[hardware.nodes]]
id = "qpu-quanta-16q-c"
kind = "qpu"
name = "QuANTA 16Q · C"
model = "superconducting-transmon"
capacity = 1
topology = { rows = 4, cols = 4 }

[[hardware.nodes]]
id = "qpu-quanta-20q-c"
kind = "qpu"
name = "QuANTA 20Q · C"
model = "superconducting-transmon"
capacity = 1
topology = { rows = 4, cols = 5 }

[[hardware.nodes]]
id = "qpu-quanta-8q-a"
kind = "qpu"
name = "QuANTA 8Q"
model = "superconducting-transmon"
capacity = 1
status = "offline"      # v1.3：离线（不可调度，前端降饱和标注）
topology = { rows = 2, cols = 4 }

[[hardware.nodes]]
id = "qpu-quanta-20q-d"
kind = "qpu"
name = "QuANTA 20Q · D"
model = "superconducting-transmon"
capacity = 1
status = "offline"      # v1.3：离线（不可调度，前端降饱和标注）
topology = { rows = 4, cols = 5 }

[[hardware.nodes]]
id = "gpu-a800-0"
kind = "gpu"
name = "A800 #0"
model = "NVIDIA A800 80GB"
capacity = 1
# v1.2 监控数据（模拟器驱动；总利用率沿用 utilization 字段）
vram_total_gb = 80.0

[[hardware.nodes]]
id = "gpu-a800-1"
kind = "gpu"
name = "A800 #1"
model = "NVIDIA A800 80GB"
capacity = 1
vram_total_gb = 80.0

[[hardware.nodes]]
id = "cpu-node-0"
kind = "cpu"
name = "经典计算节点 #0"
model = "EPYC 64C / 256GB"
capacity = 4
# v1.2 经典节点规格（cpu_usage/memory_used_gb 由模拟器驱动）
cpu_cores = 64
memory_total_gb = 256.0

# -----------------------------------------------------------------------------
# 调度器
# -----------------------------------------------------------------------------

[scheduler]
max_parallel_steps = 4     # 平台全局同时运行的步数上限
step_timeout_seconds = 60  # 单步超时（超时步标记 failed，任务视依赖决定成败）
retry_failed_steps = false # 原型默认不重试

# -----------------------------------------------------------------------------
# 租户（原型：演示租户；demo_key 可被环境变量 QAP_DEMO_API_KEY 覆盖）
# -----------------------------------------------------------------------------

[tenancy]
default_tenant = "demo"

[[tenancy.tenants]]
id = "demo"
name = "Demo 租户"
api_key = "demo-key"
role = "user"              # v1.2：user=普通用户（管理分区隐藏）；admin=管理员
max_concurrent_tasks = 2
max_messages_per_day = 1000

[[tenancy.tenants]]
id = "admin"
name = "管理员"
api_key = "admin-key"      # 演示用管理租户（生产改为环境变量/密钥散列）
role = "admin"
max_concurrent_tasks = 8
max_messages_per_day = 10000
